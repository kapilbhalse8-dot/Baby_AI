name: Baby AI - Signed Android Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          KEYSTORE: ${{ secrets.BABYAI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BABYAI_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BABYAI_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BABYAI_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE" || (echo "::error::Missing BABYAI_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Missing BABYAI_STORE_PASSWORD" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing BABYAI_KEY_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing BABYAI_KEY_ALIAS" && exit 1)

      - name: Decode permanent signing key
        env:
          BABYAI_KEYSTORE_BASE64: ${{ secrets.BABYAI_KEYSTORE_BASE64 }}
        run: |
          echo "$BABYAI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/babyai-release.jks"
          test -s "$RUNNER_TEMP/babyai-release.jks"

      - name: Build signed release APK
        env:
          BABYAI_KEYSTORE_PATH: ${{ runner.temp }}/babyai-release.jks
          BABYAI_STORE_PASSWORD: ${{ secrets.BABYAI_STORE_PASSWORD }}
          BABYAI_KEY_PASSWORD: ${{ secrets.BABYAI_KEY_PASSWORD }}
          BABYAI_KEY_ALIAS: ${{ secrets.BABYAI_KEY_ALIAS }}
          BABYAI_VERSION_CODE: ${{ github.run_number }}
          BABYAI_VERSION_NAME: 1.2.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baby-AI-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for in-place updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: baby-ai-v1.2.${{ github.run_number }}
          name: Baby AI v1.2.${{ github.run_number }}
          body: |
            Signed Android APK for Baby AI.
            Install over the existing app when it is signed with the same permanent key.
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
