name: Build Baby AI signed APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare permanent signing key
        env:
          BABYAI_KEYSTORE_BASE64: ${{ secrets.BABYAI_KEYSTORE_BASE64 }}
        run: |
          test -n "$BABYAI_KEYSTORE_BASE64" || (echo "Missing BABYAI_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$BABYAI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/babyai-release.jks"
      - name: Build signed release APK
        env:
          BABYAI_KEYSTORE_PATH: ${{ runner.temp }}/babyai-release.jks
          BABYAI_STORE_PASSWORD: ${{ secrets.BABYAI_STORE_PASSWORD }}
          BABYAI_KEY_PASSWORD: ${{ secrets.BABYAI_KEY_PASSWORD }}
          BABYAI_KEY_ALIAS: ${{ secrets.BABYAI_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease --stacktrace
      - name: Upload Baby AI signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Baby-AI-signed-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
