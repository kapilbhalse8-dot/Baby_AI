
name: Build Baby AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Extract Android project
        run: |
          unzip -o BabyAI_Android_Project.zip -d project
          test -f project/BabyAI_Android_Project_Updated/build.gradle
          test -f project/BabyAI_Android_Project_Updated/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p project/BabyAI_Android_Project_Updated assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Baby-AI-APK
          path: project/BabyAI_Android_Project_Updated/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
