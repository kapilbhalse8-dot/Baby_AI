plugins { id 'com.android.application' }

def signingStoreFile = System.getenv("BABYAI_KEYSTORE_PATH")
def signingStorePassword = System.getenv("BABYAI_STORE_PASSWORD")
def signingKeyPassword = System.getenv("BABYAI_KEY_PASSWORD")
def signingKeyAlias = System.getenv("BABYAI_KEY_ALIAS")
def releaseVersionCode = (System.getenv("BABYAI_VERSION_CODE") ?: "3").toInteger()
def releaseVersionName = System.getenv("BABYAI_VERSION_NAME") ?: "1.2.0"

if (signingStoreFile == null || signingStoreFile.isEmpty() ||
    signingStorePassword == null || signingStorePassword.isEmpty() ||
    signingKeyPassword == null || signingKeyPassword.isEmpty() ||
    signingKeyAlias == null || signingKeyAlias.isEmpty()) {
    throw new GradleException("Permanent Baby AI release signing is not configured. Check GitHub Actions secrets.")
}

android {
    namespace 'com.babyai.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.babyai.assistant'
        minSdk 26
        targetSdk 35
        versionCode releaseVersionCode
        versionName releaseVersionName
    }

    signingConfigs {
        release {
            storeFile file(signingStoreFile)
            storePassword signingStorePassword
            keyAlias signingKeyAlias
            keyPassword signingKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
