plugins { id 'com.android.application' }

def signingStoreFile = System.getenv("BABYAI_KEYSTORE_PATH")

android {
    namespace 'com.babyai.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.babyai.assistant'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (signingStoreFile != null && !signingStoreFile.isEmpty()) {
                storeFile file(signingStoreFile)
                storePassword System.getenv("BABYAI_STORE_PASSWORD")
                keyAlias System.getenv("BABYAI_KEY_ALIAS")
                keyPassword System.getenv("BABYAI_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
